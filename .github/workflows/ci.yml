name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opscore_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # app_user para la app — sujeto a RLS (valida el aislamiento real)
      DATABASE_URL: postgres://app_user:ci_app_pass@localhost:5432/opscore_test
      # postgres (superusuario) solo para migraciones
      DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5432/opscore_test
      AUTH_SECRET: ci-test-secret-32-chars-minimum!!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Crear roles de base de datos (equivale a scripts/init-db.sh en CI)
        run: |
          psql $DATABASE_URL_OWNER -c "CREATE ROLE app_user LOGIN PASSWORD 'ci_app_pass';"
          psql $DATABASE_URL_OWNER -c "GRANT CONNECT ON DATABASE opscore_test TO app_user;"
        env:
          PGPASSWORD: postgres

      - name: Aplicar migración 0001 (extensiones y funciones RLS)
        run: psql $DATABASE_URL_OWNER -f migrations/0001_init_roles_extensions.sql

      - name: Aplicar migraciones Drizzle (0002 tenancy + 0005 fase 1 DDL)
        run: npm run migrate

      - name: Aplicar migración 0003 (auditoría)
        run: psql $DATABASE_URL_OWNER -f migrations/0003_auditoria.sql

      - name: Aplicar migración 0004 (Auth.js sessions)
        run: psql $DATABASE_URL_OWNER -f migrations/0004_auth_sessions.sql

      - name: Aplicar migración 0006 (RLS Fase 1)
        run: psql $DATABASE_URL_OWNER -f migrations/0006_rls_fase1.sql

      - name: Aplicar migración 0007 (DDL Fase 2 — CFDI)
        run: psql $DATABASE_URL_OWNER -f migrations/0007_fase2_cfdi.sql

      - name: Aplicar migración 0008 (RLS Fase 2)
        run: psql $DATABASE_URL_OWNER -f migrations/0008_rls_fase2.sql

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test -- --coverage
